name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in app/js/*.js app/synth.js app/sw.js; do node --check "$f"; done
      - name: Unit tests (LAS parser, petrophysics)
        run: node --test tests/*.test.mjs
