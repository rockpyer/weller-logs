<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Well(er) Logs methods</title>
<script>try{if(localStorage.getItem("weller.theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{ --ground:#EDF0F3; --paper:#FFFFFF; --ink:#172029; --muted:#5C6975; --line:#D5DBE2; --accent:#B4541E; }
:root[data-theme="dark"]{ --ground:#12161B; --paper:#1F262E; --ink:#E4E9EE; --muted:#93A0AD; --line:#2E3740; --accent:#E07A3F; }
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
article{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 28px 28px;overflow-x:auto}
h1{font-size:26px} h2{font-size:19px;margin-top:2em;border-bottom:1px solid var(--line);padding-bottom:4px}
a{color:var(--accent)} code{font:13px "IBM Plex Mono",monospace;background:var(--ground);padding:1px 4px;border-radius:4px}
pre{white-space:pre-wrap;font:13px/1.5 "IBM Plex Mono",monospace}
table{border-collapse:collapse;margin:12px 0} th,td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
.back{display:inline-block;margin-bottom:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Well(er) Logs</a>
  <article id="doc"><p>Loading…</p></article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
// The methods live in methods.md (one source for the repo and the app); shown as plain text if marked is unavailable offline.
fetch('methods.md').then(r=>r.ok?r.text():Promise.reject(r.status)).then(md=>{
  const doc=document.getElementById('doc');
  if(window.marked){ doc.innerHTML=marked.parse(md); doc.querySelectorAll('a[href^="http"]').forEach(a=>{ a.target='_blank'; a.rel='noopener'; }); }
  else { const pre=document.createElement('pre'); pre.textContent=md; doc.replaceChildren(pre); }
}).catch(()=>{ document.getElementById('doc').textContent='Could not load the methods.'; });
</script>
</body>
</html>
